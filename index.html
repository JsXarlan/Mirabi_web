<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Sin HTML dinamico, pero GitHub Pages no deja mandar cabeceras propias:
      esta meta es la unica forma de tener CSP. connect-src incluye el
      proyecto de Supabase (auth + progress_snapshots + bucket de contenido);
      %VITE_SUPABASE_URL% lo sustituye Vite en build desde .env, asi que no
      hay que tocar esto a mano si el proyecto cambia.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' %VITE_SUPABASE_URL%; object-src 'none'; base-uri 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7B5FD0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171632" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Mirabi: aprende japonés desde cero con curso guiado, kana, repaso inteligente y Yuki."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mirabi" />
    <title>Mirabi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
